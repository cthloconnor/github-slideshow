<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animated Bar Chart</title><style>body{margin:0;background:#101827;color:#f5f7fc;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}.wrap{width:min(90vw,680px)}h1{font-size:1.35rem}.chart{height:330px;position:relative;margin:30px 0 0 42px;border-left:1px solid #9aa8be;border-bottom:2px solid #9aa8be;background:repeating-linear-gradient(to top,transparent 0,transparent calc(33.333% - 1px),#344052 calc(33.333% - 1px),#344052 33.333%)}.tick{position:absolute;left:-27px;transform:translateY(50%);font-size:13px}.bar{position:absolute;bottom:0;width:19%;left:calc(var(--slot)*33.333% + 7%);height:calc(var(--val)*33.333%);border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;box-sizing:border-box;font-weight:bold;font-size:22px;transition:left .75s cubic-bezier(.2,.8,.2,1),transform .35s ease}.bar.lift{transform:translateY(-38px)}.labels{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0 0 42px;text-align:center;font-weight:700}.controls{display:flex;align-items:center;justify-content:space-between;margin-top:30px}button{background:#fff;color:#101827;border:0;border-radius:10px;padding:15px 24px;font-size:16px;font-weight:700}button:disabled{opacity:.5}</style></head><body><main class="wrap"><h1>Animated bar chart</h1><p>Press Next Slide to lift, move and land the columns.</p><div class="chart"><span class="tick" style="bottom:33.333%">1</span><span class="tick" style="bottom:66.666%">2</span><span class="tick" style="bottom:100%">3</span><div class="bar" data-id="A" style="--slot:0;--val:1;background:#4389ff">1</div><div class="bar" data-id="B" style="--slot:1;--val:2;background:#16aa98">2</div><div class="bar" data-id="C" style="--slot:2;--val:3;background:#dc983f">3</div></div><div class="labels" id="labels"><span>A</span><span>B</span><span>C</span></div><div class="controls"><span id="status" aria-live="polite">Slide 1 / 3</span><button id="next">Next Slide →</button></div></main><script>const orders=[['A','B','C'],['B','A','C'],['C','B','A']];let index=0;const bars=[...document.querySelectorAll('.bar')],button=document.querySelector('#next');button.addEventListener('click',async()=>{if(button.disabled)return;button.disabled=true;bars.forEach(b=>b.classList.add('lift'));await new Promise(r=>setTimeout(r,380));index=(index+1)%orders.length;bars.forEach(b=>b.style.setProperty('--slot',orders[index].indexOf(b.dataset.id)));await new Promise(r=>setTimeout(r,790));bars.forEach(b=>b.classList.remove('lift'));await new Promise(r=>setTimeout(r,380));document.querySelector('#labels').innerHTML=orders[index].map(x=>'<span>'+x+'</span>').join('');document.querySelector('#status').textContent='Slide '+(index+1)+' / 3';button.disabled=false;});</script></body></html>
